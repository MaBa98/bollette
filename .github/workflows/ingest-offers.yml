name: Importa offerte Portale Offerte

on:
  schedule:
    # Due tentativi al giorno (UTC): l'orario di pubblicazione del portale non è documentato.
    # Il job è idempotente: se la pubblicazione del giorno è già importata termina subito.
    - cron: "17 5 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reimporta anche se la pubblicazione è già presente"
        type: boolean
        default: false

concurrency:
  group: ingest-offers
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Importa le offerte
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Valori fittizi: richiesti dalla configurazione, non usati dall'ingestione
          SUPABASE_URL: https://unused.supabase.co
        run: python -m app.market.ingest ${{ inputs.force && '--force' || '' }}
